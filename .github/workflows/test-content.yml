name: Test content starlight-dev against engine

on:
  push:
    branches: [master]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Content dependency check.
        id: content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ref=""
          if [ -n "$PR_BODY" ]; then
            pr=$(printf '%s' "$PR_BODY" | grep -oiP \
              '(?:Requires|Depends on)\s+\[?(?:https?://github\.com/)?ss14Starlight/space-station-14(?:#|/pull/)\K[0-9]+' \
              | head -n1) || true
            if [ -n "$pr" ]; then
              ref="refs/pull/$pr/head"
              echo "#$pr ($ref)"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out content
        uses: actions/checkout@v4.2.2
        with:
          repository: ss14Starlight/space-station-14
          ref: ${{ steps.content.outputs.ref }}
          submodules: recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x

      - name: Disable submodule autoupdate
        run: touch BuildChecker/DISABLE_SUBMODULE_AUTOUPDATE

      - name: Check out engine version
        env:
          ENGINE_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ENGINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          cd RobustToolbox
          echo "SHA: $ENGINE_SHA | REPO: $ENGINE_REPO"
          git remote add engine "https://github.com/$ENGINE_REPO.git"
          git fetch engine "$ENGINE_SHA"
          git checkout FETCH_HEAD
          git submodule update --init --recursive

      - name: Replace global.json
        run: cp RobustToolbox/global.json .

      - name: Install dependencies
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build --configuration DebugOpt --no-restore /m

      - name: Content.Tests
        shell: pwsh
        run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="$(pwd)/test_results"

      - name: Content.IntegrationTests
        shell: pwsh
        run: |
          $env:DOTNET_gcServer=1
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

      - name: Archive NUnit3 test results.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit3-results
          path: test_results/*
          retention-days: 7

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore /m
